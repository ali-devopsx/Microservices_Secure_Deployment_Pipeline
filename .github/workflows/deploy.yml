# Deploy the app to the cluster
name: Deploy

on:
  push:
    branches: [main]
    # Only deploy when the actual app code changes, not for docs-only commits
    paths:
      - 'app/**'
      - 'Dockerfile'
      - 'Dockerfile.celery'
      - 'entrypoint.sh'
      - 'k8s/**'
      - 'nginx/**'
      - 'docker-compose.yml'
      - 'docker-compose.monitoring.yml'

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply
        run: kubectl apply -f k8s/django-deployment.yaml

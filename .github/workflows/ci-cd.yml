# =========================
# CI/CD PIPELINE
# =========================
name: CI/CD Pipeline

# Trigger on push or PR to main branch
on:
  push:
    branches: [main]      # Run when code pushed to main
  pull_request:
    branches: [main]      # Run on pull request to main

  workflow_dispatch:

# Run only one pipeline at a time for the same branch.
# If we push again, cancel the old run and start a new one.
concurrency:
  # Give every workflow + branch its own group
  group: ${{ github.workflow }}-${{ github.ref }}
  # Kill the running job so we do not waste minutes on old work
  cancel-in-progress: true

# Global environment variables shared across jobs
env:
  IMAGE_NAME: cyber-portfolio                      # Docker image name
  DJANGO_SECRET_KEY: ci-test-key                   # Django key for testing only

# =========================
# JOBS
# =========================
jobs:

  # =========================
  # 1. TESTS (WITH DATABASE)
  # =========================
  tests:
    name: Run Tests                   # Run Django unit tests
    runs-on: ubuntu-latest
    needs: security-scan              # Run only after security scan passes

    # Spin up PostgreSQL container as a service
    services:
      postgres:
        image: postgres:15-alpine          # Same PostgreSQL version as production
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: app             # requirements.txt is inside app/
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: app             # manage.py is inside app/
        env:
          DB_NAME: test_db
          DB_USER: test_user
          DB_PASSWORD: test_pass
          DB_HOST: localhost
          DB_PORT: 5432
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: localhost
        run: python manage.py test


  # =========================
  # 2. BUILD + PUSH
  # =========================
  build-and-push:
    name: Build & Push Image           # build the image and push it
    runs-on: ubuntu-latest
    needs: tests                       # Run only after tests pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

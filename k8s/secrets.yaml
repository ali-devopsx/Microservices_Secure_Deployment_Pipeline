# API version
apiVersion: v1
# Secret = stores sensitive data like passwords
kind: Secret

# Info about this secret
metadata:
  # Name for this secret object
  name: cyber-app-secrets
  # Which namespace it lives in
  namespace: cyber-prod-env

# Opaque = generic key-value type for secrets
type: Opaque

# Placeholders - the pipeline replaces them with real GitHub Secrets
data:
  # Database name: cyber_db in base64
  db-name: Y3liZXJfZGI=
  # Old user kept as reference (commented out)
#  db-user: YWxp
  # Database user: cyber_user
  db-user: Y3liZXJfdXNlcg==
  # Database password
  db-password: Y2hhbmdlbWVfcGFzc3dvcmQ=
  # Redis password
  redis-password: Y2hhbmdlbWVfcmVkaXM=


  # MinIO user: minio in base64
  MINIO_ROOT_USER: bWluaW8=
  # MinIO password
  MINIO_ROOT_PASSWORD: Y2hhbmdlbWVfbWluaW8=

  # Django secret key
  django-secret-key: Y2hhbmdlbWVfZGphbmdvX3NlY3JldA==
